part1:
  random_state: 42
  cv_folds: 5

  data:
    cache_dir: data/.cache
    datasets: [concrete, airfoil, parkinsons, qsar]
    parkinsons_per_subject: 30

  gp:
    kernels: [rbf, matern]
    matern_nu: 1.5
    n_restarts_iso: 5
    n_restarts_ard: 5
    signal_bounds: [1.0e-2, 1.0e+2]
    length_scale_bounds: [1.0e-2, 1.0e+3]
    noise_bounds: [1.0e-6, 1.0e+1]

  evaluation:
    interval_level: 0.95
    results_dir: results/part1

part2: {}
